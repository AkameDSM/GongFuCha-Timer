name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Project & Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json sw.js www/ 2>/dev/null || true

          echo '{"name":"gongfucha-timer","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo '{"appId":"com.gongfucha.timer","appName":"Gong Fu Cha","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: GongFuCha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
