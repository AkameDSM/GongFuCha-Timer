name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Project & Capacitor Assets
        run: |
          mkdir -p www assets
          cp index.html manifest.json sw.js www/ 2>/dev/null || true

          # Create a proper SVG icon asset for Capacitor to process
          cat << 'EOF' > "assets/icon.svg"
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="112" fill="#0c0f0d"/>
            <ellipse cx="256" cy="420" rx="130" ry="30" fill="#5a605d"/>
            <path d="M122,256c15,112 55,174 134,184c79,-10 119,-72 134,-184z" fill="#2e3230" stroke="#739e82" stroke-width="10"/>
            <ellipse cx="256" cy="256" rx="134" ry="36" fill="#b9c2bc" stroke="#739e82" stroke-width="8"/>
            <ellipse cx="256" cy="256" rx="114" ry="26" fill="#1c211e"/>
            <path d="M164,236c15,-72 55,-92 92,-92s77,20 92,92c-40,40 -144,40 -184,0z" fill="#434745" stroke="#739e82" stroke-width="10"/>
            <rect x="226" y="92" width="60" height="50" rx="10" fill="#383c3a" stroke="#739e82" stroke-width="6"/>
            <ellipse cx="256" cy="92" rx="30" ry="13" fill="#9ea6a1"/>
          </svg>
          EOF

          echo '{"name":"gongfucha-timer","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          echo '{"appId":"com.gongfucha.timer","appName":"Gong Fu Cha","webDir":"www"}' > capacitor.config.json
          npx cap add android
          
          # Automatically generate native app icons for Android from our SVG
          npx @capacitor/assets generate --android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: GongFuCha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
