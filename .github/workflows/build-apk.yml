name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Project & Capacitor Assets
        run: |
          mkdir -p www assets
          cp index.html manifest.json sw.js www/ 2>/dev/null || true

          # Clean, minimalist tea cup & leaf icon asset
          cat << 'EOF' > "assets/icon.svg"
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="112" fill="#0c0f0d"/>
            <!-- Steam lines -->
            <path d="M210 160 C200 130, 220 110, 210 90 M256 150 C246 120, 266 100, 256 80 M302 160 C292 130, 312 110, 302 90" fill="none" stroke="#739e82" stroke-width="14" stroke-linecap="round"/>
            <!-- Tea Cup Body -->
            <path d="M146 220 C146 330, 166 380, 256 380 C346 380, 366 330, 366 220 Z" fill="#1c211e" stroke="#739e82" stroke-width="16"/>
            <!-- Tea Surface / Leaf -->
            <ellipse cx="256" cy="220" rx="110" ry="28" fill="#527961"/>
            <path d="M256 195 C280 215, 280 240, 256 250 C232 240, 232 215, 256 195 Z" fill="#b9c2bc"/>
            <!-- Saucer -->
            <path d="M116 410 C180 430, 332 430, 396 410" fill="none" stroke="#739e82" stroke-width="16" stroke-linecap="round"/>
          </svg>
          EOF

          echo '{"name":"gongfucha-timer","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          echo '{"appId":"com.gongfucha.timer","appName":"Gong Fu Cha","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx @capacitor/assets generate --android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: GongFuCha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
