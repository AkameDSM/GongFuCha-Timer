name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Project & Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true

          echo '{"name":"gongfucha-timer","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo '{"appId":"com.gongfucha.timer","appName":"Gong Fu Cha","webDir":"www"}' > capacitor.config.json
          npx cap add android

          # Inject custom Gaiwan icon directly into Android native drawable folders
          ICON_DIR="android/app/src/main/res/drawable"
          mkdir -p $ICON_DIR
          cat << 'EOF' > "$ICON_DIR/ic_launcher.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
            <path android:fillColor="#0c0f0d" android:pathData="M0,0h100v100H0z"/>
            <path android:fillColor="#5a605d" android:pathData="M24,82c0,3.3 11.6,6 26,6s26,-2.7 26,-6c0,-3.3 -11.6,-6 -26,-6S24,78.7 24,82z"/>
            <path android:fillColor="#2e3230" android:strokeColor="#739e82" android:strokeWidth="2" android:pathData="M24,50c3,22 11,34 26,36c15,-2 23,-14 26,-36z"/>
            <path android:fillColor="#b9c2bc" android:strokeColor="#739e82" android:strokeWidth="1.5" android:pathData="M50,43c14.4,0 26,3.1 26,7s-11.6,7 -26,7s-26,-3.1 -26,-7s11.6,-7 26,-7z"/>
            <path android:fillColor="#1c211e" android:pathData="M50,45c12.1,0 22,2.2 22,5s-9.9,5 -22,5s-22,-2.2 -22,-5s9.9,-5 22,-5z"/>
            <path android:fillColor="#434745" android:strokeColor="#739e82" android:strokeWidth="2" android:pathData="M32,46c3,-14 11,-18 18,-18s15,4 18,18c-8,8 -28,8 -36,0z"/>
            <path android:fillColor="#383c3a" android:strokeColor="#739e82" android:strokeWidth="1.2" android:pathData="M44,18h12v10c0,1.1 -0.9,2 -2,2h-8c-1.1,0 -2,-0.9 -2,-2z"/>
            <path android:fillColor="#9ea6a1" android:pathData="M50,15.5c3.3,0 6,1.1 6,2.5s-2.7,2.5 -6,2.5s-6,-1.1 -6,-2.5s2.7,-2.5 6,-2.5z"/>
          </vector>
          EOF

          npx cap sync android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: GongFuCha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
