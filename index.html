<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Gong Fu Cha Timer</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0c0f0d;
      --surface: #141916;
      --surface-elevated: #1c241f;
      --text: #e4ebe6;
      --muted: #7e8f83;
      --accent: #739e82;
      --accent-soft: rgba(115, 158, 130, 0.15);
      --border: #232d27;
      --btn-text: #0c0f0d;
    }

    :root[data-theme="light"] {
      --bg: #f2f4f2;
      --surface: #ffffff;
      --surface-elevated: #e5ebe6;
      --text: #1c241f;
      --muted: #647569;
      --accent: #527961;
      --accent-soft: rgba(82, 121, 97, 0.12);
      --border: #d4ded7;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      transition: background 0.25s, color 0.25s;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      padding: 16px 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.4px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      padding-top: 16px;
    }

    .screen.active { display: flex; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-value {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:active { transform: scale(0.95); }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .chip {
      padding: 8px 4px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-text);
      font-weight: 700;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 2px 0;
    }

    .checkbox-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 6px;
    }

    .setup-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .text-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      padding: 4px;
    }

    .primary-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--accent);
      color: var(--btn-text);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-soft);
    }

    .infusion-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 10px;
      scrollbar-width: none;
    }
    .infusion-strip::-webkit-scrollbar { display: none; }

    .inf-tab {
      flex: 1;
      min-width: 76px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .inf-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-text);
    }

    .inf-tab.done { opacity: 0.42; }

    .inf-tab-ord {
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .inf-tab-label {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .inf-tab-divider {
      height: 1px;
      background: currentColor;
      opacity: 0.22;
      margin: 5px 6px;
    }

    .inf-tab-time {
      font-size: 0.92rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .sub-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .sub-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ceremony-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
    }

    .countdown-num {
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 4px;
    }

    .countdown-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .gaiwan-stage {
      width: 300px;
      height: 245px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gaiwan-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #gaiwanLidGroup {
      transform-box: view-box;
      transform-origin: 140px 92px;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.4, 1);
    }

    .gaiwan-stage.open #gaiwanLidGroup {
      transform: translate(56px, 24px) rotate(34deg);
    }

    .tea-interior-contents {
      opacity: 0;
      transition: opacity 0.45s ease 0.15s;
    }

    .gaiwan-stage.open .tea-interior-contents { opacity: 1; }

    .tea-leaves-group {
      transform-box: view-box;
      transform-origin: 140px 95px;
      transition: transform 0.8s ease-out;
      transform: scale(0.88);
    }

    .gaiwan-stage.open .tea-leaves-group {
      transform: scale(1);
      animation: gentleFloat 3.2s infinite ease-in-out;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-1.5px) rotate(1deg); }
    }

    .wave-back { animation: sloshBack 3.6s linear infinite; }
    .wave-front { animation: sloshFront 2.4s linear infinite; }

    @keyframes sloshBack {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-140px); }
    }

    @keyframes sloshFront {
      0% { transform: translateX(-140px); }
      100% { transform: translateX(0px); }
    }

    .steam-group {
      opacity: 0;
      transition: opacity 0.5s ease 0.25s;
    }

    .gaiwan-stage.open .steam-group { opacity: 0.65; }

    .steam-path { animation: riseSteam 2.6s infinite ease-in-out; }
    .steam-path:nth-child(2) { animation-delay: 0.7s; }
    .steam-path:nth-child(3) { animation-delay: 1.4s; }

    @keyframes riseSteam {
      0% { transform: translateY(4px); opacity: 0.15; }
      50% { transform: translateY(-6px); opacity: 0.75; }
      100% { transform: translateY(-15px); opacity: 0; }
    }

    .timer-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 8px;
    }

    .main-btn {
      min-width: 180px;
      padding: 15px 24px;
      border-radius: 14px;
      border: 1.5px solid var(--accent);
      background: var(--surface);
      color: var(--accent);
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .main-btn.primary {
      background: var(--accent);
      color: var(--btn-text);
    }

    .mini-ctrl {
      padding: 15px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="topbar">
      <div class="topbar-title">Gong Fu Cha</div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="soundToggleBtn" onclick="toggleSound()">🔔 Sound</button>
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ Light</button>
      </div>
    </div>

    <!-- SCREEN 1: SETTINGS -->
    <div id="setupScreen" class="screen active">
      <div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">First infusion time</span>
            <span class="card-value" id="baseVal">15 sec</span>
          </div>
          <div class="slider-wrap">
            <button class="step-btn" onclick="stepParam('base', -1)">−</button>
            <input type="range" id="baseSlider" min="5" max="120" value="15" oninput="updateParam('base', this.value)">
            <button class="step-btn" onclick="stepParam('base', 1)">+</button>
          </div>
          <div class="chip-grid" id="baseChips">
            <button class="chip" onclick="updateParam('base', 5)">5
