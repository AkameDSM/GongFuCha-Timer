<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Gong Fu Cha Timer</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0c0f0d;
      --surface: #141916;
      --surface-elevated: #1c241f;
      --text: #e4ebe6;
      --muted: #7e8f83;
      --accent: #739e82;
      --accent-soft: rgba(115, 158, 130, 0.15);
      --border: #232d27;
      --btn-text: #0c0f0d;
    }

    :root[data-theme="light"] {
      --bg: #f2f4f2;
      --surface: #ffffff;
      --surface-elevated: #e5ebe6;
      --text: #1c241f;
      --muted: #647569;
      --accent: #527961;
      --accent-soft: rgba(82, 121, 97, 0.12);
      --border: #d4ded7;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      transition: background 0.25s, color 0.25s;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      padding: 16px 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.4px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      padding-top: 16px;
    }

    .screen.active { display: flex; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-value {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:active { transform: scale(0.95); }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .chip {
      padding: 8px 4px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-text);
      font-weight: 700;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 2px 0;
    }

    .checkbox-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 6px;
    }

    .setup-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .text-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      padding: 4px;
    }

    .primary-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--accent);
      color: var(--btn-text);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-soft);
    }

    .infusion-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 10px;
      scrollbar-width: none;
    }
    .infusion-strip::-webkit-scrollbar { display: none; }

    .inf-tab {
      flex: 1;
      min-width: 76px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .inf-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-text);
    }

    .inf-tab.done { opacity: 0.42; }

    .inf-tab-ord {
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .inf-tab-label {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .inf-tab-divider {
      height: 1px;
      background: currentColor;
      opacity: 0.22;
      margin: 5px 6px;
    }

    .inf-tab-time {
      font-size: 0.92rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .sub-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .sub-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ceremony-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
    }

    .countdown-num {
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 4px;
    }

    .countdown-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .gaiwan-stage {
      width: 300px;
      height: 245px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gaiwan-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #gaiwanLidGroup {
      transform-box: view-box;
      transform-origin: 140px 92px;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.4, 1);
    }

    .gaiwan-stage.open #gaiwanLidGroup {
      transform: translate(56px, 24px) rotate(34deg);
    }

    .tea-interior-contents {
      opacity: 0;
      transition: opacity 0.45s ease 0.15s;
    }

    .gaiwan-stage.open .tea-interior-contents { opacity: 1; }

    .tea-leaves-group {
      transform-box: view-box;
      transform-origin: 140px 95px;
      transition: transform 0.8s ease-out;
      transform: scale(0.88);
    }

    .gaiwan-stage.open .tea-leaves-group {
      transform: scale(1);
      animation: gentleFloat 3.2s infinite ease-in-out;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-1.5px) rotate(1deg); }
    }

    .wave-back { animation: sloshBack 3.6s linear infinite; }
    .wave-front { animation: sloshFront 2.4s linear infinite; }

    @keyframes sloshBack {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-140px); }
    }

    @keyframes sloshFront {
      0% { transform: translateX(-140px); }
      100% { transform: translateX(0px); }
    }

    .steam-group {
      opacity: 0;
      transition: opacity 0.5s ease 0.25s;
    }

    .gaiwan-stage.open .steam-group { opacity: 0.65; }

    .steam-path { animation: riseSteam 2.6s infinite ease-in-out; }
    .steam-path:nth-child(2) { animation-delay: 0.7s; }
    .steam-path:nth-child(3) { animation-delay: 1.4s; }

    @keyframes riseSteam {
      0% { transform: translateY(4px); opacity: 0.15; }
      50% { transform: translateY(-6px); opacity: 0.75; }
      100% { transform: translateY(-15px); opacity: 0; }
    }

    .timer-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 8px;
    }

    .main-btn {
      min-width: 180px;
      padding: 15px 24px;
      border-radius: 14px;
      border: 1.5px solid var(--accent);
      background: var(--surface);
      color: var(--accent);
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .main-btn.primary {
      background: var(--accent);
      color: var(--btn-text);
    }

    .mini-ctrl {
      padding: 15px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="topbar">
      <div class="topbar-title">Gong Fu Cha</div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="soundToggleBtn" onclick="toggleSound()">🔔 Sound</button>
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ Light</button>
      </div>
    </div>

    <!-- SCREEN 1: SETTINGS -->
    <div id="setupScreen" class="screen active">
      <div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">First infusion time</span>
            <span class="card-value" id="baseVal">15 sec</span>
          </div>
          <div class="slider-wrap">
            <button class="step-btn" onclick="stepParam('base', -1)">−</button>
            <input type="range" id="baseSlider" min="5" max="120" value="15" oninput="updateParam('base', this.value)">
            <button class="step-btn" onclick="stepParam('base', 1)">+</button>
          </div>
          <div class="chip-grid" id="baseChips">
            <button class="chip" onclick="updateParam('base', 5)">5s</button>
            <button class="chip" onclick="updateParam('base', 10)">10s</button>
            <button class="chip selected" onclick="updateParam('base', 15)">15s</button>
            <button class="chip" onclick="updateParam('base', 30)">30s</button>
            <button class="chip" onclick="updateParam('base', 60)">1m</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Each next infusion time</span>
            <span class="card-value" id="incVal">+5 sec</span>
          </div>
          <div class="slider-wrap">
            <button class="step-btn" onclick="stepParam('inc', -1)">−</button>
            <input type="range" id="incSlider" min="0" max="60" value="5" oninput="updateParam('inc', this.value)">
            <button class="step-btn" onclick="stepParam('inc', 1)">+</button>
          </div>
          <div class="chip-grid" id="incChips">
            <button class="chip selected" onclick="updateParam('inc', 5)">5s</button>
            <button class="chip" onclick="updateParam('inc', 10)">10s</button>
            <button class="chip" onclick="updateParam('inc', 15)">15s</button>
            <button class="chip" onclick="updateParam('inc', 30)">30s</button>
            <button class="chip" onclick="updateParam('inc', 60)">1m</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Number of infusions</span>
            <span class="card-value" id="countVal">4</span>
          </div>
          <div class="slider-wrap">
            <button class="step-btn" onclick="stepParam('count', -1)">−</button>
            <input type="range" id="countSlider" min="1" max="20" value="4" oninput="updateParam('count', this.value)">
            <button class="step-btn" onclick="stepParam('count', 1)">+</button>
          </div>
          <div class="chip-grid" id="countChips">
            <button class="chip" onclick="updateParam('count', 3)">3</button>
            <button class="chip selected" onclick="updateParam('count', 4)">4</button>
            <button class="chip" onclick="updateParam('count', 5)">5</button>
            <button class="chip" onclick="updateParam('count', 8)">8</button>
            <button class="chip" onclick="updateParam('count', 10)">10</button>
          </div>
        </div>

        <div class="card">
          <label class="checkbox-row">
            <input type="checkbox" id="rinseToggle" onchange="toggleRinse(this.checked)">
            <span class="card-title" style="cursor: pointer;">Rinse</span>
          </label>
        </div>

        <div class="card" id="rinseCard" style="display: none;">
          <div class="card-header">
            <span class="card-title">Rinse duration</span>
            <span class="card-value" id="rinseVal">5 sec</span>
          </div>
          <div class="slider-wrap">
            <button class="step-btn" onclick="stepRinse(-1)">−</button>
            <input type="range" id="rinseSlider" min="2" max="30" value="5" oninput="updateRinse(this.value)">
            <button class="step-btn" onclick="stepRinse(1)">+</button>
          </div>
          <div class="chip-grid" id="rinseChips">
            <button class="chip selected" onclick="updateRinse(5)">5s</button>
            <button class="chip" onclick="updateRinse(10)">10s</button>
            <button class="chip" onclick="updateRinse(15)">15s</button>
            <button class="chip" onclick="updateRinse(20)">20s</button>
            <button class="chip" onclick="updateRinse(30)">30s</button>
          </div>
        </div>
      </div>

      <div class="setup-footer">
        <button class="text-link" onclick="restoreDefaults()">Restore defaults</button>
        <button class="primary-btn" onclick="openBrewScreen()">Proceed to brewing</button>
      </div>
    </div>

    <!-- SCREEN 2: BREWING TIMER -->
    <div id="brewScreen" class="screen">
      <div>
        <div class="infusion-strip" id="infusionStrip"></div>
        <div class="sub-actions">
          <button class="sub-btn" onclick="restartCeremony()">↻ Restart ceremony</button>
          <button class="sub-btn" onclick="openSetupScreen()">⚙ Settings</button>
        </div>
      </div>

      <div class="ceremony-center">
        <div class="countdown-num" id="countdownNum">15</div>
        <div class="countdown-label" id="countdownStatus">1st Infusion Ready</div>

        <div class="gaiwan-stage" id="gaiwanStage">
          <svg class="gaiwan-svg" viewBox="0 0 280 235">
            <defs>
              <radialGradient id="saucerGrad" cx="42%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#9ca39e" />
                <stop offset="55%" stop-color="#5a605d" />
                <stop offset="90%" stop-color="#333735" />
                <stop offset="100%" stop-color="#222523" />
              </radialGradient>
              <linearGradient id="stonewareBodyGrad" x1="15%" y1="10%" x2="88%" y2="90%">
                <stop offset="0%" stop-color="#575b58" />
                <stop offset="32%" stop-color="#2e3230" />
                <stop offset="72%" stop-color="#1b1e1c" />
                <stop offset="100%" stop-color="#121413" />
              </linearGradient>
              <radialGradient id="lidDomeGrad" cx="35%" cy="35%" r="68%">
                <stop offset="0%" stop-color="#878c89" />
                <stop offset="40%" stop-color="#434745" />
                <stop offset="75%" stop-color="#2b2323" />
                <stop offset="100%" stop-color="#161817" />
              </radialGradient>
              <linearGradient id="celadonRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#b9c2bc" />
                <stop offset="30%" stop-color="#e3e8e5" />
                <stop offset="70%" stop-color="#c8d1cb" />
                <stop offset="100%" stop-color="#8d9690" />
              </linearGradient>
              <radialGradient id="teaLiquorGrad" cx="50%" cy="50%" r="55%">
                <stop offset="0%" stop-color="#6b9e78" stop-opacity="0.92" />
                <stop offset="65%" stop-color="#467553" stop-opacity="0.96" />
                <stop offset="100%" stop-color="#284731" stop-opacity="1" />
              </radialGradient>
              <clipPath id="bowlOpeningClip">
                <ellipse cx="140" cy="95" rx="76" ry="23" />
              </clipPath>
              <clipPath id="bowlBodyClip">
                <path d="M 62 96 C 68 148, 86 183, 114 188 Q 140 192, 166 188 C 194 183, 212 148, 218 96 Z" />
              </clipPath>
            </defs>

            <ellipse cx="140" cy="184" rx="98" ry="34" fill="url(#saucerGrad)" stroke="#484d4a" stroke-width="1.5" />
            <ellipse cx="143" cy="186" rx="64" ry="20" fill="#171a18" opacity="0.55" />
            <ellipse cx="140" cy="184" rx="54" ry="15" fill="none" stroke="#757c78" stroke-width="1" opacity="0.35" />

            <path d="M 62 96 C 68 148, 86 183, 114 188 Q 140 192, 166 188 C 194 183, 212 148, 218 96 Z"
                  fill="url(#stonewareBodyGrad)" stroke="#2c302e" stroke-width="1.5" />

            <g clip-path="url(#bowlBodyClip)">
              <g id="waterLevelGroup" transform="translate(0, 192)">
                <path class="wave-back" d="M 0 0 Q 35 -7 70 0 T 140 0 T 210 0 T 280 0 T 350 0 T 420 0 L 420 130 L 0 130 Z" fill="#527961" opacity="0.32" />
                <path class="wave-front" d="M 0 2 Q 35 9 70 2 T 140 2 T 210 2 T 280 2 T 350 2 T 420 2 L 420 130 L 0 130 Z" fill="#739e82" opacity="0.45" />
              </g>
              <path d="M 74 108 C 78 145, 92 172, 112 182" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.08" />
            </g>

            <ellipse cx="140" cy="94" rx="84" ry="27" fill="url(#celadonRimGrad)" stroke="#5b635e" stroke-width="1.2" />
            <ellipse cx="140" cy="95" rx="76" ry="23" fill="#1c211e" />

            <g class="tea-interior-contents" clip-path="url(#bowlOpeningClip)">
              <ellipse cx="140" cy="98" rx="73" ry="21" fill="url(#teaLiquorGrad)" />
              <ellipse cx="140" cy="98" rx="60" ry="15" fill="none" stroke="#a3c4ad" stroke-width="0.8" opacity="0.4" />
              <g class="tea-leaves-group">
                <path d="M 102 99 Q 116 87 131 96 Q 116 107 102 99 Z" fill="#1b3b28" />
                <path d="M 104 99 Q 116 94 129 96" fill="none" stroke="#6b9e78" stroke-width="0.9" />
                <path d="M 135 91 Q 152 83 167 94 Q 150 103 135 91 Z" fill="#274f38" />
                <path d="M 137 91 Q 151 90 164 94" fill="none" stroke="#84b593" stroke-width="0.9" />
                <path d="M 120 104 Q 139 95 155 106 Q 137 114 120 104 Z" fill="#163021" />
                <path d="M 122 104 Q 138 102 152 106" fill="none" stroke="#6b9e78" stroke-width="0.9" />
                <path d="M 154 100 Q 168 93 179 101 Q 166 108 154 100 Z" fill="#356648" />
                <path d="M 89 95 Q 102 89 112 98 Q 100 104 89 95 Z" fill="#274f38" />
              </g>
            </g>

            <path d="M 56 94 A 84 27 0 0 0 224 94" fill="none" stroke="#e3e8e5" stroke-width="2.4" opacity="0.9" />

            <g class="steam-group" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round">
              <path class="steam-path" d="M 116 82 Q 110 68 118 56 T 114 34" />
              <path class="steam-path" d="M 140 78 Q 146 64 138 50 T 142 28" />
              <path class="steam-path" d="M 162 84 Q 168 70 160 58 T 164 38" />
            </g>

            <g id="gaiwanLidGroup">
              <ellipse cx="140" cy="95" rx="70" ry="20" fill="#0d0f0e" opacity="0.55" />
              <path d="M 72 93 C 76 62, 110 52, 140 52 C 170 52, 204 62, 208 93 C 190 112, 90 112, 72 93 Z"
                    fill="url(#lidDomeGrad)" stroke="#5b635e" stroke-width="1.3" />
              <path d="M 72 93 C 92 111, 188 111, 208 93" fill="none" stroke="#c8d1cb" stroke-width="1.8" opacity="0.75" />
              <ellipse cx="142" cy="56" rx="25" ry="9" fill="#0f1210" opacity="0.65" />
              <path d="M 117 41 L 119 54 C 120 60, 160 60, 161 54 L 163 41 Z"
                    fill="#383c3a" stroke="#7d8580" stroke-width="1.2" />
              <path d="M 125 43 L 126 55 M 132 44 L 132 57 M 140 44 L 140 57 M 148 44 L 148 57 M 155 43 L 154 55"
                    stroke="#222523" stroke-width="1.2" opacity="0.6" />
              <ellipse cx="140" cy="41" rx="23" ry="8.5" fill="#9ea6a1" stroke="#484d4a" stroke-width="1.2" />
              <ellipse cx="140" cy="41" rx="17" ry="5.5" fill="#252927" stroke="#c8d1cb" stroke-width="0.8" />
              <ellipse cx="146" cy="42" rx="4.5" ry="1.6" fill="#dce3de" opacity="0.65" />
            </g>
          </svg>
        </div>
      </div>

      <div class="timer-controls">
        <button class="mini-ctrl" onclick="adjustLiveTime(-5)">−5s</button>
        <button class="main-btn primary" id="mainActionBtn" onclick="handleMainAction()">▶ Start</button>
        <button class="mini-ctrl" onclick="adjustLiveTime(5)">+5s</button>
      </div>
    </div>
  </div>

  <script>
    const chipMap = {
      base: [5, 10, 15, 30, 60],
      inc: [5, 10, 15, 30, 60],
      count: [3, 4, 5, 8, 10]
    };

    let state = {
      base: 15,
      inc: 5,
      count: 4,
      rinseEnabled: false,
      rinseSec: 5,
      currentIdx: 0,
      totalSec: 15,
      remainingMs: 15000,
      running: false,
      steepFinished: false,
      endTime: null,
      rafId: null,
      sound: true,
      wakeLock: null
    };

    const rinseChipValues = [5, 10, 15, 20, 30];

    function toOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    window.addEventListener('DOMContentLoaded', function() {
      const saved = JSON.parse(localStorage.getItem('gongfu_sage_v8') || '{}');
      updateParam('base', saved.base || 15, false);
      updateParam('inc', saved.inc !== undefined ? saved.inc : 5, false);
      updateParam('count', saved.count || 4, false);
      if (saved.rinseEnabled !== undefined) {
        state.rinseEnabled = saved.rinseEnabled;
        document.getElementById('rinseToggle').checked = state.rinseEnabled;
        document.getElementById('rinseCard').style.display = state.rinseEnabled ? 'block' : 'none';
      }
      if (saved.rinseSec) {
        state.rinseSec = saved.rinseSec;
        document.getElementById('rinseSlider').value = state.rinseSec;
        document.getElementById('rinseVal').textContent = state.rinseSec + ' sec';
        updateRinseChipsUI();
      }
      if (saved.theme) setTheme(saved.theme);
      if (saved.sound !== undefined) {
        state.sound = saved.sound;
        document.getElementById('soundToggleBtn').textContent = state.sound ? '🔔 Sound' : '🔕 Mute';
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function(){});
      }
    });

    function savePrefs() {
      localStorage.setItem('gongfu_sage_v8', JSON.stringify({
        base: state.base,
        inc: state.inc,
        count: state.count,
        rinseEnabled: state.rinseEnabled,
        rinseSec: state.rinseSec,
        theme: document.documentElement.getAttribute('data-theme'),
        sound: state.sound
      }));
    }

    function toggleRinse(enabled) {
      state.rinseEnabled = enabled;
      document.getElementById('rinseCard').style.display = enabled ? 'block' : 'none';
      savePrefs();
    }

    function updateRinse(val, save) {
      if (save === undefined) save = true;
      state.rinseSec = Math.max(2, parseInt(val, 10));
      document.getElementById('rinseSlider').value = state.rinseSec;
      document.getElementById('rinseVal').textContent = state.rinseSec + ' sec';
      updateRinseChipsUI();
      if (save) savePrefs();
    }

    function updateRinseChipsUI() {
      const chips = document.getElementById('rinseChips').children;
      rinseChipValues.forEach(function(presetVal, idx) {
        chips[idx].classList.toggle('selected', presetVal === state.rinseSec);
      });
    }

    function stepRinse(delta) {
      updateRinse(state.rinseSec + delta);
    }

    function formatCardTime(sec) {
      if (sec < 60) return sec + 's';
      const m = Math.floor(sec / 60), s = sec % 60;
      return s > 0 ? (m + 'm ' + s + 's') : (m + 'm');
    }

    function formatBigClock(ms) {
      const sec = Math.ceil(ms / 1000);
      if (sec < 60) return String(sec);
      const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2, '0');
      return m + ':' + s;
    }

    function updateParam(key, val, save) {
      if (save === undefined) save = true;
      val = Math.max(key === 'inc' ? 0 : 1, parseInt(val, 10));
      state[key] = val;
      document.getElementById(key + 'Slider').value = val;

      if (key === 'base') document.getElementById('baseVal').textContent = val >= 60 ? formatCardTime(val) : (val + ' sec');
      if (key === 'inc') document.getElementById('incVal').textContent = '+' + (val >= 60 ? formatCardTime(val) : (val + ' sec'));
      if (key === 'count') document.getElementById('countVal').textContent = String(val);

      const chips = document.getElementById(key + 'Chips').children;
      chipMap[key].forEach(function(presetVal, idx) {
        chips[idx].classList.toggle('selected', presetVal === val);
      });
      if (save) savePrefs();
    }

    function stepParam(key, delta) {
      updateParam(key, state[key] + delta);
    }

    function restoreDefaults() {
      updateParam('base', 15);
      updateParam('inc', 5);
      updateParam('count', 4);
      state.rinseEnabled = false;
      state.rinseSec = 5;
      document.getElementById('rinseToggle').checked = false;
      document.getElementById('rinseCard').style.display = 'none';
      updateRinse(5);
      savePrefs();
    }

    function openBrewScreen() {
      document.getElementById('setupScreen').classList.remove('active');
      document.getElementById('brewScreen').classList.add('active');
      loadInfusion(0);
    }

    function openSetupScreen() {
      pauseTimer();
      document.getElementById('brewScreen').classList.remove('active');
      document.getElementById('setupScreen').classList.add('active');
    }

    function getTotalSteps() {
      return state.count + (state.rinseEnabled ? 1 : 0);
    }

    function renderInfusionStrip() {
      const strip = document.getElementById('infusionStrip');
      strip.innerHTML = '';
      const total = getTotalSteps();

      for (let i = 0; i < total; i++) {
        const tab = document.createElement('div');
        tab.className = 'inf-tab ' + (i === state.currentIdx ? 'active' : (i < state.currentIdx ? 'done' : ''));
        tab.onclick = (function(index) {
          return function() { pauseTimer(); loadInfusion(index); };
        })(i);

        if (state.rinseEnabled && i === 0) {
          tab.innerHTML =
            '<div class="inf-tab-ord">Rinse</div>' +
            '<div class="inf-tab-label">Step</div>' +
            '<div class="inf-tab-divider"></div>' +
            '<div class="inf-tab-time">' + formatCardTime(state.rinseSec) + '</div>';
        } else {
          const infusionNum = state.rinseEnabled ? i : i + 1;
          const sec = state.base + (infusionNum - 1) * state.inc;
          tab.innerHTML =
            '<div class="inf-tab-ord">' + toOrdinal(infusionNum) + '</div>' +
            '<div class="inf-tab-label">Infusion</div>' +
            '<div class="inf-tab-divider"></div>' +
            '<div class="inf-tab-time">' + formatCardTime(sec) + '</div>';
        }
        strip.appendChild(tab);
      }
      const activeEl = strip.children[state.currentIdx];
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function setGaiwanOpen(isOpen) {
      document.getElementById('gaiwanStage').classList.toggle('open', isOpen);
    }

    function loadInfusion(idx) {
      state.currentIdx = idx;
      const isRinseStep = state.rinseEnabled && idx === 0;

      if (isRinseStep) {
        state.totalSec = state.rinseSec;
      } else {
        const infusionNum = state.rinseEnabled ? idx : idx + 1;
        state.totalSec = state.base + (infusionNum - 1) * state.inc;
      }
      state.remainingMs = state.totalSec * 1000;
      state.steepFinished = false;

      setGaiwanOpen(false);
      updateVisuals();
      renderInfusionStrip();

      const btn = document.getElementById('mainActionBtn');
      btn.classList.add('primary');

      if (isRinseStep) {
        document.getElementById('countdownStatus').textContent = 'Rinse Step Ready';
        btn.textContent = '▶ Start Rinse';
      } else {
        const infusionNum = state.rinseEnabled ? idx : idx + 1;
        const ord = toOrdinal(infusionNum);
        document.getElementById('countdownStatus').textContent = ord + ' Infusion Ready';
        btn.textContent = '▶ Start ' + ord;
      }
    }

    function updateVisuals() {
      document.getElementById('countdownNum').textContent = formatBigClock(state.remainingMs);
      const progress = 1 - Math.max(0, Math.min(1, state.remainingMs / (state.totalSec * 1000)));
      const waveY = 192 - (progress * 88);
      document.getElementById('waterLevelGroup').setAttribute('transform', 'translate(0, ' + waveY + ')');
    }

    function handleMainAction() {
      if (state.steepFinished) {
        if (state.currentIdx + 1 < getTotalSteps()) {
          loadInfusion(state.currentIdx + 1);
          startTimer();
        } else {
          restartCeremony();
        }
        return;
      }
      state.running ? pauseTimer() : startTimer();
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }

    function startTimer() {
      if (state.remainingMs <= 0) state.remainingMs = state.totalSec * 1000;
      state.running = true;
      state.steepFinished = false;
      setGaiwanOpen(false);
      state.endTime = performance.now() + state.remainingMs;
      requestWakeLock();

      const btn = document.getElementById('mainActionBtn');
      btn.textContent = '❚❚ Pause';
      btn.classList.remove('primary');

      if (state.rinseEnabled && state.currentIdx === 0) {
        document.getElementById('countdownStatus').textContent = 'Rinsing...';
      } else {
        const infusionNum = state.rinseEnabled ? state.currentIdx : state.currentIdx + 1;
        document.getElementById('countdownStatus').textContent = 'Steeping ' + toOrdinal(infusionNum) + ' Infusion...';
      }

      function tick(now) {
        if (!state.running) return;
        state.remainingMs = Math.max(0, state.endTime - now);
        updateVisuals();

        if (state.remainingMs <= 0) {
          completeSteep();
        } else {
          state.rafId = requestAnimationFrame(tick);
        }
      }
      state.rafId = requestAnimationFrame(tick);
    }

    function pauseTimer() {
      state.running = false;
      cancelAnimationFrame(state.rafId);
      if (state.wakeLock) { state.wakeLock.release().catch(function(){}); state.wakeLock = null; }
      if (!state.steepFinished) {
        const btn = document.getElementById('mainActionBtn');
        btn.textContent = '▶ Resume';
        btn.classList.add('primary');
        document.getElementById('countdownStatus').textContent = 'Paused';
      }
    }

    function adjustLiveTime(deltaSec) {
      if (state.steepFinished) return;
      const deltaMs = deltaSec * 1000;
      state.totalSec = Math.max(1, state.totalSec + deltaSec);
      state.remainingMs = Math.max(1000, state.remainingMs + deltaMs);
      if (state.running) state.endTime += deltaMs;
      updateVisuals();
    }

    function playZenBell() {
      if (!state.sound) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [528, 792].forEach(function(freq, idx) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(idx === 0 ? 0.35 : 0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 2.4);
        });
      } catch (e) {}
    }

    function completeSteep() {
      state.running = false;
      state.steepFinished = true;
      state.remainingMs = 0;
      updateVisuals();

      setGaiwanOpen(true);

      playZenBell();
      if (navigator.vibrate) navigator.vibrate([250, 120, 350]);

      const btn = document.getElementById('mainActionBtn');
      btn.classList.add('primary');

      const total = getTotalSteps();
      if (state.currentIdx + 1 < total) {
        if (state.rinseEnabled && state.currentIdx === 0) {
          document.getElementById('countdownStatus').textContent = 'Rinse Complete — Discard Water!';
          btn.textContent = 'Start 1st Infusion →';
        } else {
          const nextInfusionNum = state.rinseEnabled ? state.currentIdx + 1 : state.currentIdx + 2;
          const nextOrd = toOrdinal(nextInfusionNum);
          const currInfusionNum = state.rinseEnabled ? state.currentIdx : state.currentIdx + 1;
          document.getElementById('countdownStatus').textContent = toOrdinal(currInfusionNum) + ' Infusion Ready — Pour Tea!';
          btn.textContent = 'Start ' + nextOrd + ' Infusion →';
        }
      } else {
        document.getElementById('countdownStatus').textContent = 'All Infusions Complete 🍵';
        btn.textContent = '↻ Restart Ceremony';
      }
    }

    function restartCeremony() {
      pauseTimer();
      loadInfusion(0);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
      savePrefs();
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeToggleBtn').textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    function toggleSound() {
      state.sound = !state.sound;
      document.getElementById('soundToggleBtn').textContent = state.sound ? '🔔 Sound' : '🔕 Mute';
      savePrefs();
    }
  </script>
</body>
</html>
